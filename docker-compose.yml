services:
    rdesktop:
        image: giok94/linux-rdp:debian-12
        build:
            context: .
            args:
                USER_PASSWORD: ${RDP_PASSWORD:-changeme}
        container_name: rdesktop
        environment:
            - TZ=Asia/Tbilisi
        volumes:
            - ./config:/config
            - ./app:/app
        ports:
            - 3390:3389
            - 2222:22
        shm_size: "1gb"
        restart: unless-stopped